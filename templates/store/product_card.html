{% load shop_tags %}
<article class="product-card">
    <a class="product-image-wrap" href="{% url 'product_detail' product.slug %}">
        <img class="product-image" src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">
        {% if product.is_featured %}<span class="product-tag">выбор VERDE</span>{% endif %}
        <span class="image-arrow" aria-hidden="true">↗</span>
    </a>
    <div class="product-info"><div><a class="product-name" href="{% url 'product_detail' product.slug %}">{{ product.name }}</a><p>{{ product.short_description }}</p></div><div class="product-buy"><div class="product-price">{% if product.old_price %}<span class="old-price">{{ product.old_price|currency }}</span>{% endif %}<strong>{{ product.price|currency }}</strong><small>сум</small></div><form action="{% url 'add_to_basket' product.slug %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"><button class="add-button" aria-label="Добавить {{ product.name }} в корзину" type="submit">+</button></form></div></div>
</article>
